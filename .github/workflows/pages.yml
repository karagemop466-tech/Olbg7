name: Verify coverage desk

on:
  push:
    branches: [main, arena/4eb82353-olbg7]
  pull_request:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The root landing page (index.html) and /oct27/* subpages are the 2026-10-27
      # 15-sport multi-market origination & official-source dashboard built from
      # data/oct27/*.json. Earlier boards remain preserved at cycle-board.html (plus
      # all-events.html / sports/*.html), picks.html, legacy-cal4/, board/, olbg-tips/,
      # and docs/.
      - name: Rebuild the 27 Oct multi-market origination board and verify deterministic output
        run: |
          python3 tools/oct27/audit_repo.py
          python3 tools/oct27/originate_lines.py
          python3 tools/oct27/build_picks_oct27.py
          python3 tools/oct27/build_oct27_site.py
          git diff --exit-code data/oct27 oct27 index.html assets/oct27.css
      - name: Check 27 Oct data, dual row sources, links, anchors, odds band and prose
        run: python3 tools/oct27/verify_oct27.py
      - name: Check preserved board/ and olbg-tips/ links
        run: |
          python3 tools/check_today.py
          SITE_OUT=olbg-tips python3 scripts/link_check.py
      - name: Check the preserved CAL-4 board data
        run: python3 tools/check_board.py
      - name: Test fail-closed freshness behavior
        run: node --test tests/freshness.test.js

  olbg-access-probe:
    # This is an access check only. It never updates content or bypasses robots.txt.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check declared-agent access under robots.txt
        run: python3 tools/probe_olbg.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: olbg-access-probe
          path: probe-output/
          retention-days: 1
          if-no-files-found: warn
