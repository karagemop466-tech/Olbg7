name: Verify coverage desk

# GitHub Pages serves committed HTML from main:/ (legacy Pages build).
# Nothing here regenerates or overwrites the preserved historical boards.
on:
  push:
    branches: [main, arena/4eb82353-olbg7]
  pull_request:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check committed pages match the snapshot
        run: python tools/build_current.py --check
      - name: Check data, internal links and archive warnings
        run: python tools/check_current.py
      - name: Test fail-closed freshness behavior
        run: node --test tests/freshness.test.js

  olbg-access-probe:
    # This is an access check only. It never updates content or bypasses robots.txt.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check declared-agent access under robots.txt
        run: python tools/probe_olbg.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: olbg-access-probe
          path: probe-output/
          retention-days: 1
          if-no-files-found: warn
